name: Build prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-prototype-debug
          path: android/app/build/outputs/apk/debug/*.apk
  ios-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project NearbyPrototype.xcodeproj -scheme NearbyPrototype -sdk iphoneos -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - name: Test pairing validation on simulator
        working-directory: ios
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild -project NearbyPrototype.xcodeproj -scheme NearbyPrototype -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO test
      # This validates compilation only. An unsigned .app cannot be sideloaded.
