name: Build prototype
on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-prototype-debug
          path: android/app/build/outputs/apk/debug/*.apk
  android-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test real Keystore TLS handshakes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tls-tests-api-${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
  ios-compile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project NearbyPrototype.xcodeproj -scheme NearbyPrototype -sdk iphoneos -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - name: Package unsigned iPhone build for later signing
        working-directory: ios
        run: |
          # Preserve requested capabilities in the executable for re-signers
          # that discover entitlements from Mach-O, including SideSign.
          # Ad-hoc signing is metadata only: installation still needs an Apple profile.
          codesign --force --sign - --entitlements NearbyPrototype.entitlements build/Build/Products/Debug-iphoneos/NearbyPrototype.app
          codesign --display --entitlements :- build/Build/Products/Debug-iphoneos/NearbyPrototype.app > build/requested-entitlements.plist
          python3 -c 'import plistlib; e=plistlib.load(open("build/requested-entitlements.plist", "rb")); assert e.get("com.apple.developer.networking.HotspotConfiguration") is True'
          mkdir -p build/unsigned/Payload
          ditto build/Build/Products/Debug-iphoneos/NearbyPrototype.app build/unsigned/Payload/NearbyPrototype.app
          cd build/unsigned
          zip -qry NearbyPrototype-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-prototype-unsigned-needs-signing
          path: ios/build/unsigned/NearbyPrototype-unsigned.ipa
      - name: Test pairing validation on simulator
        working-directory: ios
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild -project NearbyPrototype.xcodeproj -scheme NearbyPrototype -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build-simulator -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
      # This validates compilation only. An unsigned .app cannot be sideloaded.
